<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Where data come from</title>
    <!--
      Concept animation 1 (Session 1 - Linear regressions, Block 1).
      The model y = a + b·x + ε in motion: points are drawn from Normal "bells"
      around the true line (green), then the least-squares line (blue) is fitted
      and its residuals flash. Silent, 25 s, loops seamlessly (first frame = last).
      Data: assets/data.js, generated by animations/make_data.py.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/data.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Open Sans", sans-serif; }
      #plot { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1920" data-height="1080">
      <svg id="plot" class="clip" data-start="0" data-duration="25" data-track-index="0"
           viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <script>
      // ---------------------------------------------------------------- helpers
      const NS = "http://www.w3.org/2000/svg";
      const svg = document.getElementById("plot");
      const make = (tag, attrs = {}, parent = svg) => {
        const e = document.createElementNS(NS, tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        parent.appendChild(e);
        return e;
      };
      const set = (e, attrs) => { for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); };
      const clamp = (x) => Math.max(0, Math.min(1, x));
      const prog = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
      const lerp = (a, b, p) => a + (b - a) * p;
      const E = {
        inOut: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
        out: (p) => 1 - Math.pow(1 - p, 3),
      };
      const scale = (d0, d1, r0, r1) => (v) => r0 + ((v - d0) / (d1 - d0)) * (r1 - r0);

      const C = { ink: "#595959", axis: "#BFBFBF", grid: "#EDEDED", green: "#5E8C4F",
                  greenFill: "#8BB57C", blue: "#5B7FA6", dark: "#404040" };

      function axes(o) {
        const g = make("g");
        for (const v of o.yticks) make("line", { x1: o.P.l, x2: o.P.r, y1: o.Y(v), y2: o.Y(v), stroke: C.grid, "stroke-width": 2 }, g);
        for (const v of o.xticks) make("line", { x1: o.X(v), x2: o.X(v), y1: o.P.t, y2: o.P.b, stroke: C.grid, "stroke-width": 2 }, g);
        make("line", { x1: o.P.l, x2: o.P.l, y1: o.P.t, y2: o.P.b, stroke: C.axis, "stroke-width": 2.5 }, g);
        make("line", { x1: o.P.l, x2: o.P.r, y1: o.P.b, y2: o.P.b, stroke: C.axis, "stroke-width": 2.5 }, g);
        const label = (txt, attrs) => { const e = make("text", { fill: C.ink, "font-size": 28, ...attrs }, g); e.textContent = txt; };
        for (const v of o.xticks) label(String(v), { x: o.X(v), y: o.P.b + 44, "text-anchor": "middle" });
        for (const v of o.yticks) label(String(v), { x: o.P.l - 20, y: o.Y(v) + 10, "text-anchor": "end" });
        label(o.xlabel, { x: (o.P.l + o.P.r) / 2, y: o.P.b + 100, "text-anchor": "middle", "font-size": 32 });
        label(o.ylabel, { x: 0, y: 0, "text-anchor": "middle", "font-size": 32,
                          transform: `translate(${o.P.l - 92} ${(o.P.t + o.P.b) / 2}) rotate(-90)` });
        return g;
      }

      // ---------------------------------------------------------------- scene
      const D = window.ANIM_DATA;
      const DUR = 25;
      const P = { l: 230, r: 1830, t: 60, b: 900 };
      const X = scale(0, 12.5, P.l, P.r);
      const Y = scale(0, 12, P.b, P.t);
      const mu = (x) => D.true.intercept + D.true.slope * x;
      const fitY = (x) => D.ols.intercept + D.ols.slope * x;
      const sigma = D.true.sigma;
      const n = D.x.length;

      axes({ P, X, Y, xticks: [0, 2, 4, 6, 8, 10, 12], yticks: [0, 2, 4, 6, 8, 10, 12],
             xlabel: "Text length (hundreds of words)", ylabel: "Reading time (minutes)" });

      // paint order: bells, ε trails, residuals, true line, least-squares line, points
      const gBells = make("g");
      const bells = D.bells.map((xb) => {
        let d = `M ${X(xb)} ${Y(mu(xb) - 3.2 * sigma)}`;
        for (let i = 0; i <= 80; i++) {
          const z = -3.2 + (6.4 * i) / 80;
          d += ` L ${X(xb + 1.35 * Math.exp((-z * z) / 2))} ${Y(mu(xb) + z * sigma)}`;
        }
        d += ` L ${X(xb)} ${Y(mu(xb) + 3.2 * sigma)} Z`;
        return make("path", { d, fill: C.greenFill, "fill-opacity": 0.28, stroke: C.greenFill,
                              "stroke-width": 3, opacity: 0 }, gBells);
      });
      const gTrails = make("g");
      const trails = D.x.map(() => make("line", { stroke: C.green, "stroke-width": 3.5, "stroke-linecap": "round", opacity: 0 }, gTrails));
      const gRes = make("g");
      const residuals = D.x.map(() => make("line", { stroke: C.dark, "stroke-width": 3.5, opacity: 0 }, gRes));
      const trueLine = make("line", { stroke: C.green, "stroke-width": 6, "stroke-dasharray": "22 14", opacity: 0 });
      const lsLine = make("line", { stroke: C.blue, "stroke-width": 8, opacity: 0 });
      const gPts = make("g");
      const points = D.x.map(() => make("circle", { r: 12, fill: C.ink, opacity: 0 }, gPts));

      // ---------------------------------------------------------------- timeline
      function render(t) {
        const fadeAll = 1 - E.inOut(prog(t, 23.0, 24.6));

        // 0.3–2.6 s: the true line draws in
        const pTrue = E.inOut(prog(t, 0.3, 2.6));
        set(trueLine, { x1: X(0), y1: Y(mu(0)), x2: X(12.5 * pTrue), y2: Y(mu(12.5 * pTrue)),
                        opacity: pTrue > 0 ? fadeAll : 0 });

        // 3–5 s: Normal bells grow sideways along the line; 15–16.6 s: they fade
        bells.forEach((b, k) => {
          const grow = E.out(prog(t, 3.0 + 0.3 * k, 4.4 + 0.3 * k));
          const xb = X(D.bells[k]);
          set(b, { transform: `translate(${xb} 0) scale(${Math.max(grow, 1e-4)} 1) translate(${-xb} 0)`,
                   opacity: grow > 0 ? 1 - E.inOut(prog(t, 15.0, 16.6)) : 0 });
        });

        // 6–15 s: each point leaves the true line and settles at its observed value (ε)
        D.x.forEach((x, i) => {
          const ti = 6.0 + (i * 8.2) / (n - 1);
          const y = lerp(mu(x), D.y[i], E.out(prog(t, ti, ti + 0.9)));
          set(points[i], { cx: X(x), cy: Y(y), opacity: clamp((t - ti) / 0.15) * fadeAll });
          set(trails[i], { x1: X(x), y1: Y(mu(x)), x2: X(x), y2: Y(y),
                           opacity: t >= ti ? 0.8 * (1 - prog(t, ti + 0.9, ti + 1.9)) : 0 });

          // 20–21.4 s: residuals flash, sweeping left to right; gone by 23 s
          const r0 = 20.0 + (x / 12.5) * 0.9;
          const pr = E.out(prog(t, r0, r0 + 0.45));
          set(residuals[i], { x1: X(x), y1: Y(fitY(x)), x2: X(x), y2: Y(lerp(fitY(x), D.y[i], pr)),
                              opacity: pr > 0 ? 0.85 * (1 - prog(t, 22.2, 23.0)) : 0 });
        });

        // 17–19.6 s: the least-squares line sweeps in
        const pLs = E.inOut(prog(t, 17.0, 19.6));
        set(lsLine, { x1: X(0), y1: Y(fitY(0)), x2: X(12.5 * pLs), y2: Y(fitY(12.5 * pLs)),
                      opacity: pLs > 0 ? fadeAll : 0 });
      }

      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
      render(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
