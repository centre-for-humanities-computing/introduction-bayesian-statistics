[project]
name = "bayesian-statistics"
version = "0.1.0"
description = "Introduction to Bayesian statistics - Center for Humanities Computing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arviz>=1.3",
    "ipykernel>=7.2.0",
    "ipython>=9.10.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "pymc>=6.4",
    "ruff>=0.15.4",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "python-pptx>=1.0.2",
    "qrcode[pil]>=8.2",
]
